version: '3.8'

services:
  loadout:
    build: .
    container_name: gxo-loadout-edge-server
    expose:
      - "8000"
    ports:
      - "8000:8000" # Keep port 8000 mapped for direct HTTP testing if desired
    environment:
      - HOST=0.0.0.0 # inside the container; Caddy fronts external traffic
      - COSMOS_ENDPOINT=${COSMOS_ENDPOINT:-} # OpenAI-compatible endpoint on the Vast.ai GPU server, e.g. http://<vast-ip>:<port>/v1
      - COSMOS_API_KEY=${COSMOS_API_KEY:-}
      - COSMOS_MODEL_NAME=${COSMOS_MODEL_NAME:-nvidia/Cosmos-Reason1-7B}
      - COSMOS_TIMEOUT_SECONDS=${COSMOS_TIMEOUT_SECONDS:-90}
      - USE_HTTPS=false # FastAPI runs on plain HTTP internally, Caddy handles HTTPS externally
    volumes:
      - ./uploads:/app/uploads
      - ./loadout.db:/app/loadout.db
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: gxo-loadout-https-proxy
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - loadout
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
